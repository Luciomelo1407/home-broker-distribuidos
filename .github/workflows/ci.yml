# CI mínimo (README, Dev 1): o mesmo que cada um roda antes de abrir o PR.
# Os jobs de TS e Rust rodam em paralelo; o e2e do Gateway sobe o Postgres do compose.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Jest só carrega o Nest 12 (ESM puro) a partir do Node 24.9
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm -r typecheck
      # T-14 (lado TS) roda aqui, junto com os testes de packages/contracts
      - run: pnpm -r test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # T-14 (lado Rust) e os testes do domínio
      - run: cargo test

  gateway-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: cp .env.example .env
      - name: Postgres e Redis com as migrações
        run: |
          docker compose up -d --wait postgres redis
          docker compose up --build --exit-code-from engine engine
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bolsa/gateway test:e2e
      - if: failure()
        run: docker compose logs

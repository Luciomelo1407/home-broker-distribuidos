# CI mínimo (README, Dev 1): o mesmo que cada um roda antes de abrir o PR.
# Os jobs de TS e Rust rodam em paralelo; o e2e do Gateway sobe o Postgres do compose.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Jest só carrega o Nest 12 (ESM puro) a partir do Node 24.9
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm -r typecheck
      # T-14 (lado TS) roda aqui, junto com os testes de packages/contracts
      - run: pnpm -r test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # T-14 (lado Rust) e os testes do domínio
      - run: cargo test

  integracao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: cp .env.example .env
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Postgres e Redis
        run: docker compose up -d --wait postgres redis
      # Aplica as migrações e roda T-07, T-08, T-09 e T-11 contra o Postgres real
      - name: Integração do Motor
        run: cargo test -p engine --test processor
        env:
          TEST_DATABASE_URL: postgres://engine_app:engine_dev@localhost:5432/bolsa
      # O e2e do POST /ordens precisa do Motor de verdade consumindo o stream
      - name: Motor
        run: |
          docker compose up -d --build engine
          for i in $(seq 30); do
            docker compose exec -T redis redis-cli EXISTS motor:heartbeat | grep -q 1 && exit 0
            sleep 1
          done
          docker compose logs engine
          exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bolsa/gateway test:e2e
      - if: failure()
        run: docker compose logs

# Serviço de Agentes Automáticos (NPCs - RF-019, RF-020).
# Regra 3.3.5: opera exclusivamente pela API do Gateway (http://gateway:3001), sem acesso direto a Postgres ou Redis.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agents
  namespace: simulador-bolsa
  labels:
    app.kubernetes.io/name: agents
    app.kubernetes.io/component: npc-agents
    app.kubernetes.io/part-of: simulador-bolsa
spec:
  # Uma instância gerencia os N agentes configurados em AGENTES_CONSERVADORES e AGENTES_AGRESSIVOS
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agents
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agents
        app.kubernetes.io/component: npc-agents
        app.kubernetes.io/part-of: simulador-bolsa
    spec:
      initContainers:
        - name: wait-for-gateway
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Aguardando Gateway (http://gateway:3001/mercado) estar pronto e com seed concluído..."
              until wget -qO- http://gateway:3001/mercado >/dev/null 2>&1; do
                sleep 2
              done
              echo "Gateway pronto."
      containers:
        - name: agents
          image: simulador-bolsa/agents:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: bolsa-config
                  key: GATEWAY_URL
            - name: AGENTES_CONSERVADORES
              valueFrom:
                configMapKeyRef:
                  name: bolsa-config
                  key: AGENTES_CONSERVADORES
            - name: AGENTES_AGRESSIVOS
              valueFrom:
                configMapKeyRef:
                  name: bolsa-config
                  key: AGENTES_AGRESSIVOS
            - name: AGENTES_SENHA
              valueFrom:
                secretKeyRef:
                  name: bolsa-secrets
                  key: AGENTES_SENHA
          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
            limits:
              cpu: '300m'
              memory: '256Mi'

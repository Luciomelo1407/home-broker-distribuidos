# Gateway (NestJS - REST + WebSocket + Auth).
# Componente stateless escalável horizontalmente para suportar 5, 20, 50 e 100+ usuários simultâneos (§7.7).
# O Service NodePort expõe a borda na porta 30001 (e 3001 internamente no cluster).
# O Service Headless permite ao Prometheus descobrir e coletar métricas de cada réplica individualmente.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: simulador-bolsa
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: simulador-bolsa
spec:
  type: NodePort
  ports:
    - name: http
      port: 3001
      targetPort: 3001
      nodePort: 30001
      protocol: TCP
  selector:
    app.kubernetes.io/name: gateway
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-headless
  namespace: simulador-bolsa
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: simulador-bolsa
spec:
  clusterIP: None
  ports:
    - name: http
      port: 3001
      targetPort: 3001
      protocol: TCP
  selector:
    app.kubernetes.io/name: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: simulador-bolsa
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: simulador-bolsa
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/component: api-gateway
        app.kubernetes.io/part-of: simulador-bolsa
    spec:
      initContainers:
        - name: wait-for-postgres-and-redis
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Aguardando Postgres (postgres:5432) e Redis (redis:6379)..."
              until nc -z postgres 5432 && nc -z redis 6379; do
                sleep 2
              done
              echo "Postgres e Redis disponíveis."
        - name: wait-for-engine-migrations
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Aguardando Motor aplicar migrações e expor /metrics (engine:9100)..."
              until wget -qO- http://engine:9100/metrics >/dev/null 2>&1; do
                sleep 2
              done
              echo "Migrações aplicadas e Motor pronto."
      containers:
        - name: gateway
          image: simulador-bolsa/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: bolsa-config
                  key: POSTGRES_DB
            - name: GATEWAY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bolsa-secrets
                  key: GATEWAY_DB_PASSWORD
            - name: GATEWAY_DATABASE_URL
              value: 'postgres://gateway_app:$(GATEWAY_DB_PASSWORD)@postgres:5432/$(POSTGRES_DB)'
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: bolsa-config
                  key: REDIS_URL
            - name: GATEWAY_PORT
              valueFrom:
                configMapKeyRef:
                  name: bolsa-config
                  key: GATEWAY_PORT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: bolsa-config
                  key: LOG_LEVEL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bolsa-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRACAO
              valueFrom:
                configMapKeyRef:
                  name: bolsa-config
                  key: JWT_EXPIRACAO
            - name: ORDEM_TIMEOUT_MS
              valueFrom:
                configMapKeyRef:
                  name: bolsa-config
                  key: ORDEM_TIMEOUT_MS
            - name: SALDO_INICIAL
              valueFrom:
                configMapKeyRef:
                  name: bolsa-config
                  key: SALDO_INICIAL
            - name: ACOES_INICIAIS
              valueFrom:
                configMapKeyRef:
                  name: bolsa-config
                  key: ACOES_INICIAIS
            - name: AGENTES_CONSERVADORES
              valueFrom:
                configMapKeyRef:
                  name: bolsa-config
                  key: AGENTES_CONSERVADORES
            - name: AGENTES_AGRESSIVOS
              valueFrom:
                configMapKeyRef:
                  name: bolsa-config
                  key: AGENTES_AGRESSIVOS
            - name: AGENTES_SENHA
              valueFrom:
                secretKeyRef:
                  name: bolsa-secrets
                  key: AGENTES_SENHA
          resources:
            requests:
              cpu: '200m'
              memory: '256Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
          readinessProbe:
            httpGet:
              path: /mercado
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /metrics
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

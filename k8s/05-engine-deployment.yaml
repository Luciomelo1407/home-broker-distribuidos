# Motor de Casamento em Rust (Matching Engine).
# Escritor único (replicas: 1, strategy: Recreate) que aplica as migrações SQL ao subir,
# reconstrói o livro de ofertas do Postgres e processa o stream "orders" em ordem total (RF-014, RF-024).
apiVersion: v1
kind: Service
metadata:
  name: engine
  namespace: simulador-bolsa
  labels:
    app.kubernetes.io/name: engine
    app.kubernetes.io/component: matching-engine
    app.kubernetes.io/part-of: simulador-bolsa
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
      protocol: TCP
  selector:
    app.kubernetes.io/name: engine
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine
  namespace: simulador-bolsa
  labels:
    app.kubernetes.io/name: engine
    app.kubernetes.io/component: matching-engine
    app.kubernetes.io/part-of: simulador-bolsa
spec:
  # Regra de arquitetura (§2 e §5.1): escritor único sequencial para garantir consistência forte (RNF-01)
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: engine
        app.kubernetes.io/component: matching-engine
        app.kubernetes.io/part-of: simulador-bolsa
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Aguardando PostgreSQL (postgres:5432) ficar pronto..."
              until nc -z postgres 5432; do
                sleep 2
              done
              echo "PostgreSQL acessível."
        - name: wait-for-redis
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Aguardando Redis (redis:6379) ficar pronto..."
              until nc -z redis 6379; do
                sleep 2
              done
              echo "Redis acessível."
      containers:
        - name: engine
          image: simulador-bolsa/engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: bolsa-config
                  key: POSTGRES_DB
            - name: ENGINE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bolsa-secrets
                  key: ENGINE_DB_PASSWORD
            - name: DATABASE_URL
              value: 'postgres://engine_app:$(ENGINE_DB_PASSWORD)@postgres:5432/$(POSTGRES_DB)'
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: bolsa-config
                  key: REDIS_URL
            - name: ORDEM_TIMEOUT_MS
              valueFrom:
                configMapKeyRef:
                  name: bolsa-config
                  key: ORDEM_TIMEOUT_MS
            - name: ENGINE_METRICS_PORT
              valueFrom:
                configMapKeyRef:
                  name: bolsa-config
                  key: ENGINE_METRICS_PORT
          resources:
            requests:
              cpu: '250m'
              memory: '128Mi'
            limits:
              cpu: '1000m'
              memory: '256Mi'
          # O servidor HTTP em :9100 (/metrics) só é iniciado após sqlx::migrate!,
          # reconstrução do livro no Postgres e conexão ao Redis (apps/engine/src/main.rs).
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9100
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9100
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

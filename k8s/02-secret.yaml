# Secret com credenciais de banco de dados, assinatura JWT e senha dos agentes.
# Em produção, deve ser injetado via External Secrets / Sealed Secrets;
# para o cluster local de testes de carga, stringData mantém legibilidade e compatibilidade com .env.example.
apiVersion: v1
kind: Secret
metadata:
  name: bolsa-secrets
  namespace: simulador-bolsa
  labels:
    app.kubernetes.io/part-of: simulador-bolsa
type: Opaque
stringData:
  POSTGRES_PASSWORD: 'postgres_dev'
  ENGINE_DB_PASSWORD: 'engine_dev'
  GATEWAY_DB_PASSWORD: 'gateway_dev'
  JWT_SECRET: 'troque-este-segredo-em-producao'
  AGENTES_SENHA: 'troque-a-senha-dos-agentes'

# PostgreSQL 16 (Fonte da Verdade) como StatefulSet com PersistentVolumeClaim (PVC).
# Garante identidade de rede estável e armazenamento persistente para transações ACID (RF-016, RNF-01).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: simulador-bolsa
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: simulador-bolsa
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app.kubernetes.io/name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: simulador-bolsa
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: simulador-bolsa
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: simulador-bolsa
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: bolsa-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: bolsa-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bolsa-secrets
                  key: POSTGRES_PASSWORD
            - name: ENGINE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bolsa-secrets
                  key: ENGINE_DB_PASSWORD
            - name: GATEWAY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bolsa-secrets
                  key: GATEWAY_DB_PASSWORD
            # Subdiretório dentro do mount evita conflito com a pasta lost+found em volumes ext4
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: '250m'
              memory: '256Mi'
            limits:
              cpu: '1000m'
              memory: '512Mi'
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d/01-papeis.sh
              subPath: 01-papeis.sh
              readOnly: true
      volumes:
        - name: postgres-init
          configMap:
            name: bolsa-config
            defaultMode: 0755
            items:
              - key: 01-papeis.sh
                path: 01-papeis.sh
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/part-of: simulador-bolsa
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 1Gi

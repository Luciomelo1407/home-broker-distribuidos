# Coleta das métricas do RF-026 (arquitetura §4.3). Consultas úteis no relatório de carga:
#   rate(bolsa_ordens_processadas_total[30s])                                ordens/s
#   histogram_quantile(0.95, rate(bolsa_ordem_latencia_segundos_bucket[1m])) p95 da ordem
#   sum(bolsa_clientes_conectados)                                           conectados
#   rate(bolsa_gateway_process_cpu_seconds_total[30s])                       CPU do Gateway
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ['gateway:3001']
  # O Motor expõe as dele quando o telemetry do Dev 2 existir (RF-026). Descomente e
  # ajuste a porta:
  # - job_name: engine
  #   static_configs:
  #     - targets: ['engine:9100']

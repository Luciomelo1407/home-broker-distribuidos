[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
rust_decimal = "1.36"
anyhow = "1.0.104"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "rust_decimal"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
redis = { version = "1.7.1", features = ["tokio-comp", "streams"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

[dev-dependencies]
proptest = "1.6"

[lints]
workspace = true

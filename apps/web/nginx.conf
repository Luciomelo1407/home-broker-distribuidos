server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O navegador chega pela porta publicada do Docker (3000).
    # Redirecionamentos relativos preservam o host e a porta externos.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }
}

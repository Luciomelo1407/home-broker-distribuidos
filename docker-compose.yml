# Ponto único de subida do sistema (RNF-09): docker compose up
#
# Postgres, Redis, o Motor (aplica as migrações e consome o stream "orders"), o Gateway e o
# Home Broker, os agentes (NPCs) e o Prometheus.
#
# As portas de Postgres e Redis são publicadas só em 127.0.0.1, para rodar apps e
# testes fora do Docker durante o desenvolvimento. Na demo, só Home Broker e
# Gateway ficam acessíveis de fora (system design §5.5).

name: simulador-bolsa

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina no .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      # Lidas por db/init/01-papeis.sh para criar engine_app e gateway_app
      ENGINE_DB_PASSWORD: ${ENGINE_DB_PASSWORD:?defina no .env}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?defina no .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  engine:
    build:
      context: .
      dockerfile: apps/engine/Dockerfile
    environment:
      DATABASE_URL: postgres://engine_app:${ENGINE_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      ORDEM_TIMEOUT_MS: ${ORDEM_TIMEOUT_MS:?defina no .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # RF-024, demo CA-05: derrubado, o Docker o sobe de novo e ele reconstrói o livro
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    environment:
      GATEWAY_DATABASE_URL: postgres://gateway_app:${GATEWAY_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      GATEWAY_PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:?defina no .env}
      JWT_SECRET: ${JWT_SECRET:?defina no .env}
      JWT_EXPIRACAO: ${JWT_EXPIRACAO:?defina no .env}
      ORDEM_TIMEOUT_MS: ${ORDEM_TIMEOUT_MS:?defina no .env}
      SALDO_INICIAL: ${SALDO_INICIAL:?defina no .env}
      ACOES_INICIAIS: ${ACOES_INICIAIS:?defina no .env}
      AGENTES_CONSERVADORES: ${AGENTES_CONSERVADORES:?defina no .env}
      AGENTES_AGRESSIVOS: ${AGENTES_AGRESSIVOS:?defina no .env}
      AGENTES_SENHA: ${AGENTES_SENHA:?defina no .env}
    ports:
      # Porta de entrada da demo (system design §5.5): acessível de outras máquinas
      - '${GATEWAY_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # O Motor aplica as migrações; o Gateway sobe depois e não depende dele para viver
      engine:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      # Home Broker da demo (CA-01): abra http://<ip-da-máquina>:WEB_PORT em outro computador
      - '${WEB_PORT:-3000}:80'
    depends_on:
      - gateway
    restart: unless-stopped

  agents:
    build:
      context: .
      dockerfile: apps/agents/Dockerfile
    # Regra 3.3.5: só a URL do Gateway, nada de banco nem Redis (RF-019)
    environment:
      GATEWAY_URL: http://gateway:3001
      AGENTES_CONSERVADORES: ${AGENTES_CONSERVADORES:?defina no .env}
      AGENTES_AGRESSIVOS: ${AGENTES_AGRESSIVOS:?defina no .env}
      AGENTES_SENHA: ${AGENTES_SENHA:?defina no .env}
    depends_on:
      - gateway
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      # Painel de métricas da demo e do teste de carga (RF-026): só na máquina local
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  postgres-data:
